<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Rush - Cyberpunk Neon Edition</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at center, #111, #000);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

#glow-layer {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  box-shadow: inset 0 0 0px #00ffcc;
  transition: box-shadow 0.4s ease;
  z-index: 5;
}

#particleCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}

#larp-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: white;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 100;
  opacity: 0;
}

#larp-overlay img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scale(1.5);
}

.game {
  position: relative;
  width: 380px;
  padding: 20px;
  border-radius: 25px;
  background: #1a1a1a;
  box-shadow: 0 0 30px rgba(0,255,255,0.1);
  z-index: 20;
}

.slot-machine {
  display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
  background: #222; padding: 10px; border-radius: 15px; border: 3px solid #444;
}

.reel { width: 60px; height: 60px; background: #333; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid #555; }
.reel-strip { position: absolute; width: 100%; text-align: center; top: 0; }
.slot-item { height: 60px; line-height: 60px; font-size: 30px; }

.fever-active { border-color: #ffcc00 !important; box-shadow: 0 0 25px #ffcc00; animation: pulse 1s infinite; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

.top { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 18px; }
.timer { color: #00ffcc; font-weight: bold; }
.score { color: #ffcc00; }

.question { text-align: center; font-size: 36px; margin: 25px 0; font-weight: bold; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { padding: 15px; font-size: 18px; border: none; border-radius: 10px; background: #222; color: white; cursor: pointer; transition: 0.2s; }
.correct { background: #00cc66 !important; }
.wrong { background: #cc0033 !important; }

.bottom { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
.combo { color: #00ffcc; font-weight: bold; }
.hidden { display: none; }
.big-btn { margin-top: 20px; padding: 15px 30px; font-size: 18px; border-radius: 10px; background: #00ccff; color: black; border: none; cursor: pointer; }
</style>
</head>
<body>

<div id="glow-layer"></div>
<canvas id="particleCanvas"></canvas>

<div id="larp-overlay">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3a37yK4V_Ew7rS5zX9yP1Y2C2z7R9f6B_8Q&s" id="larp-img">
</div>

<div class="game">
  <div class="slot-machine" id="slotMachine">
    <div class="reel"><div class="reel-strip" id="reel1"></div></div>
    <div class="reel"><div class="reel-strip" id="reel2"></div></div>
    <div class="reel"><div class="reel-strip" id="reel3"></div></div>
  </div>

  <div class="start-screen" id="startScreen">
    <h1>⚡ Math Rush</h1>
    <p>제한 시간: 1분</p>
    <button class="big-btn" onclick="startGame()">시작</button>
  </div>

  <div class="play-screen hidden" id="playScreen">
    <div class="top">
      <div class="timer">⏱ <span id="time">60</span></div>
      <div class="score">🏆 <span id="score">0</span></div>
    </div>
    <div class="question" id="question">1 + 1</div>
    <div class="choices" id="choices"></div>
    <div class="bottom">
      <div class="combo">🔥 COMBO x<span id="combo">0</span></div>
      <div id="feedback"></div>
    </div>
  </div>

  <div class="end-screen hidden" id="endScreen">
    <h2>🎉 최종 종료</h2>
    <p>점수: <span id="finalScore"></span></p>
    <button class="big-btn" onclick="location.reload()">다시하기</button>
  </div>
</div>

<script>
let score = 0;
let time = 60;
let combo = 0;
let isFever = false;
let isSecondChance = false;
let hasResurrected = false;
let correctAnswer;
let timer;
let particles = [];
let pillars = [];

const symbols = ['💎', '🍀', '🔥', '🍎', '🔔', '7'];
const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];

function initReels() {
  reels.forEach(reel => {
    reel.innerHTML = '';
    for(let i=0; i<40; i++) {
      let div = document.createElement('div');
      div.className = 'slot-item';
      div.textContent = symbols[i % symbols.length];
      reel.appendChild(div);
    }
  });
}

function spinSlots() {
  const isJackpot = Math.random() < 0.3;
  reels.forEach((reel, i) => {
    let targetIndex = isJackpot ? symbols.indexOf('7') : Math.floor(Math.random() * symbols.length);
    const move = (30 + targetIndex) * 60; 
    reel.style.transition = `transform ${0.6 + i * 0.3}s cubic-bezier(0.23, 1, 0.32, 1)`;
    reel.style.transform = `translateY(-${move}px)`;
  });
  return isJackpot;
}

const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
const glowLayer = document.getElementById('glow-layer');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// 기둥 클래스 (하늘색/분홍색 지원)
class Pillar {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.width = Math.random() * 15 + 10;
    this.opacity = 0.8;
    // 하늘색(#00ffff)과 분홍색(#ff00ff) 중 랜덤 선택
    this.color = Math.random() < 0.5 ? "#00ffff" : "#ff00ff";
  }
  update() {
    this.width -= 0.6; 
    this.opacity -= 0.02;
  }
  draw() {
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.width / 2, 0, this.width, canvas.height);
    ctx.restore();
  }
}

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 10;
    this.size = Math.random() * 5 + 2;
    this.speedY = Math.random() * 5 + 3;
    this.speedX = Math.random() * 6 - 3;
    this.opacity = 1;
    if (isSecondChance) {
      const colors = ['#00ffff', '#ff00ff', '#ffff00'];
      this.color = colors[Math.floor(Math.random() * colors.length)];
    } else {
      this.color = isFever ? '#ffcc00' : '#00ffcc';
    }
  }
  update() { this.y -= this.speedY; this.opacity -= 0.01; }
  draw() { ctx.fillStyle = this.color; ctx.globalAlpha = this.opacity; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if ((combo > 0 || isFever) && Math.random() < 0.5) {
    particles.push(new Particle());
    if (isSecondChance && Math.random() < 0.3) {
      pillars.push(new Pillar());
    }
  }

  for (let i = 0; i < pillars.length; i++) {
    pillars[i].update();
    pillars[i].draw();
    if (pillars[i].width <= 0 || pillars[i].opacity <= 0) {
      pillars.splice(i, 1);
      i--;
    }
  }

  for (let i = 0; i < particles.length; i++) {
    particles[i].update(); particles[i].draw();
    if (particles[i].opacity <= 0) { particles.splice(i, 1); i--; }
  }
  requestAnimationFrame(animate);
}

function triggerLarpResurrection() {
  clearInterval(timer);
  hasResurrected = true;
  isSecondChance = true;
  const overlay = document.getElementById('larp-overlay');
  const img = document.getElementById('larp-img');
  overlay.style.display = 'flex';
  overlay.style.opacity = '1';
  img.style.transform = 'scale(1)';
  setTimeout(() => {
    overlay.style.opacity = '0';
    overlay.style.transition = 'opacity 0.4s ease-out';
    setTimeout(() => {
      overlay.style.display = 'none';
      time = 30;
      document.getElementById('time').textContent = time;
      document.getElementById('time').style.color = '#ff00ff'; 
      startTimer();
    }, 400);
  }, 500);
}

function startGame() {
  initReels();
  animate();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('playScreen').classList.remove('hidden');
  nextQuestion();
  startTimer();
}

function startTimer() {
  timer = setInterval(() => {
    if (!isFever) {
      time--;
      document.getElementById('time').textContent = time;
      if (time <= 0) {
        if (!hasResurrected) triggerLarpResurrection();
        else endGame();
      }
    }
  }, 1000);
}

function checkAnswer(button, answer) {
  if (answer === correctAnswer) {
    const isJackpot = spinSlots();
    if (isJackpot) {
        isFever = true;
        document.getElementById('slotMachine').classList.add('fever-active');
        setTimeout(() => { isFever = false; document.getElementById('slotMachine').classList.remove('fever-active'); }, 5000);
    }
    combo += 1;
    score += (10 + combo * 5) * (isJackpot ? 12 : 1);
    button.classList.add('correct');
    let color = isSecondChance ? ['rgba(0,255,255,0.8)', 'rgba(255,0,255,0.8)', 'rgba(255,255,0,0.8)'][combo % 3] : (isFever ? 'rgba(255,204,0,0.7)' : 'rgba(0,255,204,0.7)');
    glowLayer.style.boxShadow = `inset 0 0 ${Math.min(combo*20, 160)}px ${color}`;
  } else {
    if (!isFever) {
      combo = 0;
      glowLayer.style.boxShadow = `inset 0 0 0px transparent`;
    }
    button.classList.add('wrong');
  }
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = combo;
  setTimeout(nextQuestion, 400);
}

function nextQuestion() {
  let a = Math.floor(Math.random() * 10) + 2;
  let b = Math.floor(Math.random() * 10) + 2;
  let op = ['+', '-', '*'][Math.floor(Math.random() * 3)];
  if (op === '+') correctAnswer = a + b;
  else if (op === '-') { if (a < b) [a, b] = [b, a]; correctAnswer = a - b; }
  else correctAnswer = a * b;
  document.getElementById('question').textContent = `${a} ${op} ${b}`;
  let answers = [correctAnswer];
  while (answers.length < 4) {
    let wrong = correctAnswer + Math.floor(Math.random() * 10 - 5);
    if (!answers.includes(wrong) && wrong >= 0) answers.push(wrong);
  }
  answers.sort(() => Math.random() - 0.5);
  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '';
  answers.forEach(ans => {
    let btn = document.createElement('button');
    btn.textContent = ans;
    btn.onclick = () => checkAnswer(btn, ans);
    choicesDiv.appendChild(btn);
  });
}

function endGame() {
  clearInterval(timer);
  document.getElementById('playScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.remove('hidden');
  document.getElementById('finalScore').textContent = score;
}
</script>
</body>
</html>
